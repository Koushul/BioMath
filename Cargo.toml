[package]
name = "bio-math"
version = "0.1.0"
edition = "2021"
description = "BioMath DSL: plain-English biological rules to mathematical models"
license = "MIT OR Apache-2.0"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
csv = "1.3"

[dev-dependencies]
approx = "0.5"

[[example]]
name = "hypoxia"
path = "examples/hypoxia.rs"

[[example]]
name = "pdac_caf"
path = "examples/pdac_caf.rs"

[[example]]
name = "logistic_growth"
path = "examples/logistic_growth.rs"

[[example]]
name = "gc_grn"
path = "examples/gc_grn.rs"

[[example]]
name = "gc_grn_wt_vs_ko"
path = "examples/gc_grn_wt_vs_ko.rs"
